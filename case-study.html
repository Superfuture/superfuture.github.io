<style>
  :root {
    --bg: 0 0% 4%;
    --surface: 0 0% 8%;
    --text: 0 0% 96%;
    --muted: 0 0% 53%;
    --stroke: 0 0% 12%;
  }
  *,*::before,*::after { box-sizing:border-box; }
  html, body { margin:0; padding:0; }
  body {
    font-family: 'Inter', sans-serif;
    background: hsl(var(--bg));
    color: hsl(var(--text));
    -webkit-font-smoothing: antialiased;
  }
  .font-display { font-family: 'Instrument Serif', serif; }
  .accent-gradient {
    background: linear-gradient(90deg, #89AACC 0%, #4E85BF 100%);
  }
  @keyframes gradient-shift {
    0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}
  }
  .ring-btn { position: relative; isolation: isolate; }
  .ring-btn::before {
    content:''; position:absolute; inset:-2px; border-radius:9999px;
    padding:2px; background:linear-gradient(90deg,#89AACC,#4E85BF,#89AACC);
    background-size:200% 200%; animation:gradient-shift 6s ease infinite;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    opacity:0; transition: opacity .3s ease; z-index:-1;
  }
  .ring-btn:hover::before { opacity:1; }

  .halftone {
    background-image: radial-gradient(circle, #000 1px, transparent 1px);
    background-size: 4px 4px;
  }

  .pulse-dot { position:relative; }
  .pulse-dot::after {
    content:''; position:absolute; inset:0; border-radius:9999px;
    background:#10b981; opacity:.6; animation:pulse 2s ease-out infinite;
  }
  @keyframes pulse {
    0%{transform:scale(1);opacity:.6}
    100%{transform:scale(2.5);opacity:0}
  }

  .reveal { opacity:0; transform: translateY(20px); transition: opacity .8s ease, transform .8s ease; }
  .reveal.in { opacity:1; transform: translateY(0); }

  /* Stat number gradient */
  .stat-num {
    background: linear-gradient(180deg, #ffffff 0%, #89AACC 100%);
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-fill-color: transparent;
            color: transparent;
  }

  .accent-rule {
    background: linear-gradient(90deg, #89AACC 0%, transparent 100%);
    height: 1px;
  }

  /* Pull-quote */
  .pullquote::before { content: '“'; }
  .pullquote::after { content: '”'; }

  /* Inline case-study media */
  .cs-media {
    display: block;
    margin: 28px 0 0;
    width: 100%;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid hsl(var(--stroke));
    background: hsl(var(--surface));
    box-shadow: 0 22px 50px rgba(0,0,0,0.45);
  }
  .cs-media video, .cs-media img { width: 100%; height: auto; display: block; }
  .cs-media-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    margin-top: 28px;
  }
  .cs-media-row img {
    width: 100%;
    border-radius: 18px;
    border: 1px solid hsl(var(--stroke));
    box-shadow: 0 14px 30px rgba(0,0,0,0.35);
  }

  /* App CTA button */
  .cs-app-cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 26px;
    border-radius: 9999px;
    background: hsl(var(--text));
    color: hsl(var(--bg));
    font-weight: 500;
    text-decoration: none;
    font-size: 15px;
    transition: transform .25s ease, filter .25s ease;
  }
  .cs-app-cta:hover { transform: translateY(-2px); filter: brightness(1.05); }
  .cs-app-cta-wrap {
    display: flex;
    justify-content: center;
    margin-top: 16px;
  }

  /* Lite YouTube embed */
  .yt-lite {
    display: block;
    position: relative;
    aspect-ratio: 16 / 9;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid hsl(var(--stroke));
    background: #111;
    cursor: pointer;
    transition: transform .4s ease, border-color .4s ease;
    text-decoration: none;
    margin-top: 24px;
  }
  .yt-lite:hover { transform: scale(1.01); border-color: rgba(137,170,204,0.5); }
  .yt-lite img.poster {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform .6s ease;
  }
  .yt-lite:hover img.poster { transform: scale(1.04); }
  .yt-lite .yt-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.0) 0%, rgba(0,0,0,0.45) 100%);
    display: flex; align-items: center; justify-content: center;
    transition: background .3s ease;
  }
  .yt-play {
    width: 72px; height: 72px;
    border-radius: 9999px;
    background: linear-gradient(135deg, #89AACC, #4E85BF);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 36px rgba(78,133,191,0.45), 0 0 0 6px rgba(255,255,255,0.05);
    transition: transform .25s ease;
  }
  .yt-lite:hover .yt-play { transform: scale(1.08); }
  .yt-play svg { width: 28px; height: 28px; fill: #fff; margin-left: 5px; }
  .yt-meta {
    position: absolute;
    bottom: 18px;
    left: 20px; right: 20px;
    color: rgba(255,255,255,0.92);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    display: flex; justify-content: space-between; align-items: center;
    font-style: normal;
  }
</style>

              style="background:hsl(var(--surface)); color:hsl(var(--text))">

  <div class="max-w-[1200px] mx-auto px-6 md:px-10 lg:px-16 pb-8 flex flex-col md:flex-row items-center justify-between gap-4">
    <div class="flex items-center gap-4 text-sm" style="color:hsl(var(--muted))">
      <a href="https://www.linkedin.com/in/jprim" class="hover:text-[color:hsl(var(--text))]">LinkedIn</a>
      <a href="https://x.com/jp" class="hover:text-[color:hsl(var(--text))]">x.com/jp</a>

<script>
const CASES = {
  'linkedin-premium': {
    name: 'LinkedIn Premium',
    category: 'Premium Mobile · 2022–Present',
    role: 'Design Lead, Premium Mobile',
    team: 'Cross-functional pod: PM, eng, data science, research',
    location: 'Sunnyvale, CA',
    headline: 'Reimagining premium mobile at hundreds-of-millions scale in the AI era.',
    hero: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055344_5eff02e0-87a5-41ce-b64f-eb08da8f33db.png&w=1280&q=85',
    stats: [
      { k: 'Members reached', v: '100M+' },
      { k: 'AI-native concepts shipped to test', v: '20+' },
      { k: 'Avg. concept-to-prototype', v: '< 24h' },
    ],
    sections: [
      {
        h: 'Context',
        body: `LinkedIn Premium is one of the largest subscription products in the world, with hundreds of millions of professionals across the network. By 2023 the question wasn't whether AI would change Premium, but how to design a product where the most valuable feature might be a conversation, a coach, or a forecast, not a feed.<br/><br/>The challenge: deliver tangible career value to professionals while keeping the experience calm, intuitive, and unmistakably human. Every shipped change is felt at planetary scale.`
      },
      {
        h: 'My role',
        body: `I lead design for premium product experiences, driving product vision, high-fidelity prototyping, and cross-functional alignment in ambiguous spaces. I work closely with PM, eng, data science, and research to take fuzzy AI capabilities and turn them into clear, opinionated product surfaces.<br/><br/>One thing that became a superpower for me was using AI-native workflows to rapidly prototype concepts, pressure-test ideas, and help teams make faster, higher-confidence decisions.`
      },
      {
        h: 'LinkedIn × Calendly',
        body: `<strong class="text-text-primary">Book an appointment, directly from a LinkedIn Premium profile.</strong> I partnered with Calendly on a shipped integration that turns a Premium professional&rsquo;s profile into a real conversion surface. Premium subscribers can add a custom &ldquo;Book an appointment&rdquo; button to their profile, and a browser extension lets them drop scheduling links straight into LinkedIn Messaging, Sales Navigator, and Recruiter without switching tabs.<br/><br/>The design problem: make a third-party scheduling action feel native to a LinkedIn profile, not bolted on. Calendly is the second most-recognized blue logo in the SaaS world; the trick was honoring both brands without creating a Frankenstein. The button reads as LinkedIn surface, the booking flow reads as Calendly trust.<br/><div class="cs-media-row"><img loading="lazy" src="https://images.ctfassets.net/k0lk9kiuza3o/7heMHsZRy4PYeWnwwgTVev/6b7c2595a59e93b9d7bb3c40db67310e/LinkedIn-Blue-128_2x_1.svg" alt="LinkedIn × Calendly integration" style="background:#fff; padding:24px;"/></div><br/><strong class="text-text-primary">Why it matters.</strong> &ldquo;Messages into meetings&rdquo; is the highest-value loop on Premium. Closing the gap between a warm connection and a booked call is what subscribers actually pay for. <a href="https://calendly.com/integration/linkedin" target="_blank" rel="noopener" style="color:#89AACC; text-decoration:underline;">View the integration ↗</a>`
      },
      {
        h: 'Process',
        body: `<strong class="text-text-primary">Prototype before brief.</strong> Instead of starting with a doc and ending with a screen, I start with the screen. AI-native tooling lets me ship a clickable, opinionated artifact in hours, something a PM, engineer, or exec can react to, not just read.<br/><br/><strong class="text-text-primary">Pressure-test with the team, not the room.</strong> Concepts get tested in the wild with cross-functional partners, not socialized in slides. The bar is "would you use it" not "would you approve it."<br/><br/><strong class="text-text-primary">Ship and learn.</strong> Premium gets real signal fast. I structure shipped experiments to teach the team something specific, not just to move a metric.`
      },
      {
        h: 'Key decisions',
        body: `<strong class="text-text-primary">Designing the value, not the wall.</strong> Premium products often optimize for the paywall. I push the team to design what's behind it, the actual moment of help, first.<br/><br/><strong class="text-text-primary">AI as a calm collaborator.</strong> Generative features can feel slot-machine-y; I designed for calm, predictable interactions where the AI's job is clearly scoped and its limits are honest.<br/><br/><strong class="text-text-primary">Mobile-first for premium.</strong> Most professionals touch LinkedIn on phone first. Premium features have to feel native to mobile, not bolted on from a desktop affordance.`
      },
      {
        h: 'Outcomes',
        body: `Premium concepts I led drove meaningful engagement and monetization lifts in shipped experiments. More importantly, the prototyping rhythm I introduced is now used across the broader Premium design org, faster decisions, higher craft, fewer ambiguous slide reviews.`
      },
      {
        h: 'Reflection',
        body: `Designing AI products at scale is less about the model and more about the contract you make with the user. Show your work, hold the bar on craft, and remember that "magic" without trust is just confusion.`
      }
    ],
    quote: 'Prototype before brief.',
    next: 'wing',
    appUrl: 'https://www.linkedin.com/premium/',
    appLabel: 'Try LinkedIn Premium',
  },

  'wing': {
    name: 'Wing @ Google X',
    category: 'Mobile · Moonshot · 2017–2022',
    role: 'Lead Product Designer, Consumer Mobile Experience',
    team: 'Wing consumer team, PM, eng, hardware, regulatory, operations',
    location: 'Mountain View / SF',
    headline: 'Designing the first FAA-approved drone delivery experience, for a behavior people had never experienced before.',
    hero: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055654_911201c5-36d9-4bc6-bac7-331adfce159f.png&w=1280&q=85',
    heroVideo: 'opensky.mp4',
    stats: [
      { k: 'FAA-approved deployments', v: 'First in the U.S.' },
      { k: 'New consumer behavior', v: 'From scratch' },
      { k: 'Disciplines coordinated', v: 'HW × SW × Regulatory' },
    ],
    sections: [
      {
        h: 'Context',
        body: `Wing is Alphabet's drone delivery moonshot. By the time I joined, the hardware worked. The harder problem was on the ground: how do you ask a normal human to trust that a small autonomous aircraft is going to fly to their house, lower a package on a tether, and leave?<br/><br/>This wasn't a feature. It was a behavior nobody had ever performed before. And we couldn't ship until the FAA, the operations team, the pilots, and the customer all believed the same thing was happening at the same moment.`
      },
      {
        h: 'My role',
        body: `I led design for the consumer experience, the actual app and on-the-ground moments that real people would touch when ordering a drone delivery. That meant the ordering flow, the wait state, the handoff at the doorstep, and every recovery state when weather, wind, or wildlife intervened.<br/><br/>The work was equal parts product design, behavioral psychology, and regulatory translation. The hardest decisions were about what to communicate and what to hide, too much information frightened people, too little broke trust.`
      },
      {
        h: 'Process',
        body: `<strong class="text-text-primary">Map a behavior that doesn't exist.</strong> I spent the early phase doing diary studies and in-field tests just to understand what people expected when "the sky" was the delivery channel. Most people had never looked up.<br/><br/><strong class="text-text-primary">Trust through transparency.</strong> The single biggest design lever was showing the drone's position and intent in real time. We let users see what the drone was doing, in language the FAA could approve.<br/><br/><strong class="text-text-primary">Design the failure first.</strong> A drone delivery has more abort states than a normal order. We designed for weather aborts, wind aborts, late captures, and returns before we polished the happy path.`
      },
      {
        h: 'Key decisions',
        body: `<strong class="text-text-primary">Show the drone, always.</strong> An anxious user wants to know what's happening overhead. We invested in a real-time live view that became the calming centerpiece of the experience.<div class="cs-media"><video src="opensky.mp4" autoplay muted loop playsinline preload="auto"></video></div><br/><strong class="text-text-primary">Motion as trust.</strong> The drone&rsquo;s on-screen movement, the package descent, the arrival cue: every easing curve was tuned to feel calm and predictable, never urgent. Motion was the primary trust-builder on a product where a small autonomous aircraft is overhead.<br/><br/><strong class="text-text-primary">Lean on the food-delivery mental model.</strong> Customers already understood "your courier is on the way", we framed the drone the same way to avoid teaching a new metaphor.<br/><br/><strong class="text-text-primary">Doorstep handoff as a moment.</strong> The drone lowering the package is the headline moment of the product. We designed an audio + on-screen cue to make it unmistakable, calm, and a little magical.`
      },
      {
        h: 'Outcomes',
        body: `The work contributed to one of the first FAA-approved drone delivery experiences in the United States, a live commercial deployment serving real customers in real neighborhoods. Beyond launch, the consumer trust model we shipped became reference design across the broader Alphabet aerial delivery work.`
      },
      {
        h: 'Reflection',
        body: `Designing for a behavior nobody has ever performed is the most humbling work I've done. You can't research your way to a confident answer, you have to put a real artifact in someone's hand and watch their body language. Every assumption I started with was wrong by version three.`
      }
    ],
    quote: 'Trust the people you fly over.',
    next: 'january-ai',
    appUrl: 'https://wing.com',
    appLabel: 'Visit Wing',
  },

  'january-ai': {
    name: 'January AI',
    category: 'Senior Mobile · AI Health · 2024–Present',
    role: 'Senior Product Designer, iOS',
    team: 'Mobile pod: PM, iOS engineering, AI/ML, clinical',
    location: 'Remote · SF Bay Area',
    headline: 'iOS for clinical-grade AI nutrition. See a food&rsquo;s impact before you eat it.',
    hero: 'https://cdn.prod.website-files.com/6308dfdad12c3f6da8d1069d/67e4502c1829ba2d1a6c1574_Device4.png',
    stats: [
      { k: 'Foods in database', v: '54M+' },
      { k: 'App Store rating', v: '4.5★' },
      { k: 'Glucose prediction', v: 'Sensor-free' },
    ],
    sections: [
      {
        h: 'Context',
        body: `January AI is a clinical-grade AI nutrition platform. The thesis: most people change their eating only when they can <em>see</em> a food&rsquo;s impact before they take a bite, and most can&rsquo;t afford a continuous glucose monitor to find out. So January built an AI that predicts the spike from a photo, then shipped it as an iOS app accessible to anyone with a phone.<br/><br/>My job: design the consumer surface where AI, behavior change, and clinical rigor have to feel like one calm app.`
      },
      {
        h: 'The headline feature: AI food scanning',
        body: `<strong class="text-text-primary">Point. Shoot. Predict.</strong> The photo logger is the front door of the product. A user opens the camera, captures their plate, and the app returns an identified meal, macros, calories, and a predicted glucose spike, all in a couple of seconds.<div class="cs-media-row"><img loading="lazy" src="https://cdn.prod.website-files.com/6308dfdad12c3f6da8d1069d/67e44f8da9a21476fe6f19a3_Device3.png" alt="January AI device"/><img loading="lazy" src="https://cdn.prod.website-files.com/6308dfdad12c3f6da8d1069d/67e4502c1829ba2d1a6c1574_Device4.png" alt="January AI device"/><img loading="lazy" src="https://cdn.prod.website-files.com/6308dfdad12c3f6da8d1069d/663a87fc761f0fddb2acc445_Screen%205.png" alt="January AI device"/></div><br/>The design challenge: make multi-second AI inference feel like magic, not waiting. I designed the scanning animation as a calm sequence with three intentional beats: capture, recognize, predict. Each beat has its own motion vocabulary. By the time the spike chart resolves, the user has been quietly told a story about what the AI is doing. The animation hides the latency by giving it meaning.<br/><br/>Database: 54 million foods. Logger accuracy: highest on the market. None of which matters without a delightful first-touch interaction.`
      },
      {
        h: 'Glucose predictions, without a sensor',
        body: `January&rsquo;s breakthrough is predicting glycemic response from a photo, no CGM required. Designing for this is unusual: we&rsquo;re showing a clinically meaningful chart to a consumer who likely doesn&rsquo;t know what an AUC is.<br/><br/>The decisions: a single readable spike curve, no medical jargon at first surface, color encoded so a glance tells you "yes" or "swap." The full clinical detail is one tap away for the curious. Calm at default, deep on demand.`
      },
      {
        h: 'Jan, the AI coach',
        body: `Jan is the in-app AI coach. Conversational, personalized to your goals, present without being noisy. Designing for an AI coach meant designing for trust: when does Jan speak, when does Jan stay quiet, and how does the app make clear that this is an assistant, not a doctor.<br/><br/>The interaction model treats Jan as a layer that <em>understands</em> the rest of the app, not a separate chat island. You can ask Jan from anywhere. The answer lands in context, right where the question came from.`
      },
      {
        h: 'Mobile craft',
        body: `Senior mobile design at this product means owning the texture: scanning motion, haptics on a confirmed log, the easing on a spike chart, the gesture for swapping a food, the empty states, the accessibility pass. Every detail is the product when the product is asking people to change a habit.<br/><br/>Built native iOS, with a design system tuned for clinical readability in dark + light, and motion designed to feel like the app is paying attention to you, not the other way around.`
      },
      {
        h: 'Reflection',
        body: `Designing clinical-grade AI for everyday humans is a different bar than designing for power users. The audience is anyone with a phone and a reason to change. The product has to feel calm, trustworthy, and a little bit magical at the moment of truth, then get out of the way.`
      }
    ],
    quote: "See a food's impact before you eat it.",
    next: 'little-monsters',
    appUrl: 'https://january.ai/app',
    appLabel: 'Open the January AI app',
  },

  'little-monsters': {
    name: 'Little Monsters',
    category: 'Co-Founder · Lady Gaga · 2011–2012',
    role: 'Co-Founder · Product Designer',
    team: 'Co-founded with Lady Gaga (Backplane)',
    location: 'Los Angeles · New York',
    headline: 'Co-founded a creative social platform with Lady Gaga before fan platforms were a category.',

        body: `In 2011 I co-founded Little Monsters with Lady Gaga, a purpose-built creative community for her global superfan base. Inspired by what DeviantArt did for my own creative development, I designed a platform that treated fans as artists, not audience. A place to share, create, and inspire, where fan art was fine art and belonging was the product.`

      {
        h: 'The problem',
        body: `<strong class="text-text-primary">Fans had no real home.</strong> In 2011, fan communities lived in comment sections, Facebook groups, and scattered forums. They had no dedicated creative infrastructure: no tools, no identity, no sense of permanence. Little Monsters was built to change that. Not just a social network, but a creative platform purpose-built for one of the world&rsquo;s most passionate fan communities, with tools, culture, and a philosophy to match their energy.`
      },
      {
        h: 'What we built',
        body: `<strong class="text-text-primary">Six tools. One culture.</strong><br/><br/><strong class="text-text-primary">01 Creative Studio.</strong> &ldquo;Inspired by&rdquo; remixing, where fans built on each other&rsquo;s art and created collaborative chains of creativity that spanned the globe.<br/><br/><strong class="text-text-primary">02 Live Translation.</strong> Real-time community chat via Google Translate, so a fan in Tokyo and one in São Paulo could connect without friction.<br/><br/><strong class="text-text-primary">03 One-Click Merch.</strong> Fan artwork on apparel in minutes. Your creation could ship to the world the same day.<br/><br/><strong class="text-text-primary">04 Monster Map.</strong> Location-based fan discovery for concert meetups, turning strangers in a venue into community before the first song.<br/><br/><strong class="text-text-primary">05 Monstervisions.</strong> Exclusive behind-the-scenes from Gaga that felt personal, not broadcast. The real Gaga, for her real fans.<br/><br/><strong class="text-text-primary">06 Webcam Drops.</strong> Instant content from webcam to community. Zero friction between creative impulse and published post.`
      },
      {
        h: 'Cultural impact',
        body: `<strong class="text-text-primary">An inclusive safe space.</strong> The platform became a lifeline for LGBTQ+ youth, bullied teenagers, and young people battling anxiety and depression. A space built around love and acceptance that existed nowhere else for its community.<br/><br/><strong class="text-text-primary">Launching creative careers.</strong> Artists like Helen Green gained global recognition through the platform. Her fan art caught Gaga&rsquo;s eye and opened doors to Haus of Gaga collaboration. Little Monsters turned fans into professionals.<br/><br/><strong class="text-text-primary">Artist–fan reinvented.</strong> Gaga participated in chatrooms, shared Monstervisions, and responded directly to fan art. Not broadcasting to an audience: being present with a community.<br/><br/><strong class="text-text-primary">No borders, one community.</strong> Real-time translation meant language was no longer a wall. Creativity was the common language.`

)); transform:rotate(1deg); transition: transform .35s ease;"/><img loading="lazy" src="https://assets.dunked.com/assets/prod/117833/p1bba63p7jvqu10au1ag31r4s1kf0h.png" alt="Fan art" style="width:100%; aspect-ratio:1/1.2; object-fit:cover; border-radius:14px; border:1px solid hsl(var(--stroke)); transform:rotate(-2deg); transition: transform .35s ease;"/><img loading="lazy" src="https://assets.dunked.com/assets/prod/117833/p1bba63p7k1nij1ql01irs1c514d7o.png" alt="Fan art" style="width:100%; aspect-ratio:1/1.3; object-fit:cover; border-radius:14px; border:1px solid hsl(var(--stroke)); transform:rotate(1.5deg); transition: transform .35s ease;"/><img loading="lazy" src="https://assets.dunked.com/assets/prod/117833/p1bbdqr8b8dbontm1o1j1cii6h83.jpg" alt="Fan art" style="width:100%; aspect-ratio:1/1.2; object-fit:cover; border-radius:14px; border:1px solid hsl(var(--stroke)); transform:rotate(-1deg); transition: transform .35s ease;"/></div>`

function render(slug) {
  const c = CASES[slug];
  if (!c) { location.hash = '#linkedin-premium'; return; }
  document.title = `${c.name}, Joey Primiani`;
  document.getElementById('csChip').textContent = c.name;

  const root = document.getElementById('csRoot');
  root.innerHTML = `
    <article class="max-w-[1200px] mx-auto px-6 md:px-10 lg:px-16">
      <!-- Hero -->
      <header class="reveal mb-12 md:mb-16">
        <div class="text-xs uppercase tracking-[0.3em] mb-6" style="color:hsl(var(--muted))">${c.category}</div>
        <h1 class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl leading-[1.05] tracking-tight max-w-4xl mb-8" style="color:hsl(var(--text))">
          ${c.headline}
        </h1>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6 md:gap-10 pt-8 border-t" style="border-color:hsl(var(--stroke))">
          <div>
            <div class="text-xs uppercase tracking-[0.2em] mb-2" style="color:hsl(var(--muted))">Project</div>
            <div class="text-sm md:text-base" style="color:hsl(var(--text))">${c.name}</div>
          </div>
          <div>
            <div class="text-xs uppercase tracking-[0.2em] mb-2" style="color:hsl(var(--muted))">Role</div>
            <div class="text-sm md:text-base" style="color:hsl(var(--text))">${c.role}</div>
          </div>
          <div>
            <div class="text-xs uppercase tracking-[0.2em] mb-2" style="color:hsl(var(--muted))">Team</div>
            <div class="text-sm md:text-base" style="color:hsl(var(--text))">${c.team}</div>
          </div>
          <div>
            <div class="text-xs uppercase tracking-[0.2em] mb-2" style="color:hsl(var(--muted))">Location</div>
            <div class="text-sm md:text-base" style="color:hsl(var(--text))">${c.location}</div>
          </div>
        </div>
      </header>

      <!-- Hero image -->
      <div class="reveal relative overflow-hidden rounded-3xl mb-16 md:mb-24 border" style="border-color:hsl(var(--stroke)); aspect-ratio: 16/9;">
        ${c.heroVideo
          ? `<video src="${c.heroVideo}" autoplay muted loop playsinline preload="auto" poster="${c.hero}" class="absolute inset-0 w-full h-full object-cover"></video>`
          : `<img src="${c.hero}" alt="" class="absolute inset-0 w-full h-full object-cover" loading="eager"/>`}
        <div class="halftone absolute inset-0 opacity-20 mix-blend-multiply pointer-events-none"></div>
      </div>

      <!-- Stats strip -->
      <div class="reveal grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-10 mb-20 md:mb-28">
        ${c.stats.map(s => `
          <div class="border-t pt-6" style="border-color:hsl(var(--stroke))">
            <div class="stat-num text-5xl md:text-6xl font-display italic leading-none mb-3">${s.v}</div>
            <div class="text-xs uppercase tracking-[0.25em]" style="color:hsl(var(--muted))">${s.k}</div>
          </div>`).join('')}
      </div>

      <!-- Sections -->
      <div class="grid grid-cols-1 md:grid-cols-12 gap-10 md:gap-16">
        <div class="md:col-span-12 space-y-16 md:space-y-24">
          ${c.sections.map((s, i) => `
            <section class="reveal grid grid-cols-1 md:grid-cols-12 gap-6 md:gap-10">
              <div class="md:col-span-3">
                <div class="text-xs uppercase tracking-[0.3em] mb-2" style="color:hsl(var(--muted))">0${i+1}</div>
                <h2 class="text-2xl md:text-3xl" style="color:hsl(var(--text))">
                  ${s.h.includes(' ')
                    ? s.h.split(' ').map((w, wi)=> wi === s.h.split(' ').length-1 ? `<span class="font-display italic">${w}</span>` : w).join(' ')
                    : `<span class="font-display italic">${s.h}</span>`}
                </h2>
              </div>
              <div class="md:col-span-9">
                <p class="text-base md:text-lg leading-relaxed" style="color:hsl(var(--text) / .85)">${s.body}</p>
              </div>
            </section>
          `).join('')}

          ${c.appUrl ? `
            <section class="reveal cs-app-cta-wrap">
              <a href="${c.appUrl}" target="_blank" rel="noopener" class="cs-app-cta">
                ${c.appLabel || 'Open the app'} <span aria-hidden="true">↗</span>
              </a>
            </section>
          ` : ''}

          <!-- Pull quote -->
          <section class="reveal py-12 md:py-16 border-y" style="border-color:hsl(var(--stroke))">
            <p class="pullquote text-3xl md:text-5xl lg:text-6xl font-display italic leading-tight max-w-4xl mx-auto text-center" style="color:hsl(var(--text))">
              ${c.quote}
            </p>
          </section>
        </div>
      </div>
    </article>
  `;

  // wire next link
  const next = CASES[c.next];
  document.getElementById('nextLink').href = '#' + c.next;
  document.getElementById('nextName').innerHTML = `<span class="font-display italic">${next.name}</span> →`;
  document.getElementById('nextCat').textContent = next.category;

  // reveal animations
  requestAnimationFrame(() => {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('in');
          io.unobserve(e.target);
        }
      });
    }, { rootMargin: '-40px' });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));
  });

  window.scrollTo({ top: 0, behavior: 'instant' });
}

function route() {
  const slug = (location.hash || '#linkedin-premium').slice(1);
  render(slug);
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
