<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          body: ['Inter','sans-serif'],
          display: ['"Instrument Serif"','serif'],
        },
        colors: {
          bg: 'hsl(var(--bg))',
          surface: 'hsl(var(--surface))',
          'text-primary': 'hsl(var(--text))',
          muted: 'hsl(var(--muted))',
          stroke: 'hsl(var(--stroke))',
        }
      }
    }
  }
</script>
<style>
  :root {
    --bg: 0 0% 4%;
    --surface: 0 0% 8%;
    --text: 0 0% 96%;
    --muted: 0 0% 53%;
    --stroke: 0 0% 12%;
  }
  *,*::before,*::after { box-sizing:border-box; }
  html, body { margin:0; padding:0; }
  body {
    font-family: 'Inter', sans-serif;
    background: hsl(var(--bg));
    color: hsl(var(--text));
    -webkit-font-smoothing: antialiased;
  }
  .font-display { font-family: 'Instrument Serif', serif; }
  .accent-gradient {
    background: linear-gradient(90deg, #89AACC 0%, #4E85BF 100%);
  }
  @keyframes gradient-shift {
    0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}
  }
  .ring-btn { position: relative; isolation: isolate; }
  .ring-btn::before {
    content:''; position:absolute; inset:-2px; border-radius:9999px;
    padding:2px; background:linear-gradient(90deg,#89AACC,#4E85BF,#89AACC);
    background-size:200% 200%; animation:gradient-shift 6s ease infinite;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    opacity:0; transition: opacity .3s ease; z-index:-1;
  }
  .ring-btn:hover::before { opacity:1; }

  .halftone {
    background-image: radial-gradient(circle, #000 1px, transparent 1px);
    background-size: 4px 4px;
  }

  .pulse-dot { position:relative; }
  .pulse-dot::after {
    content:''; position:absolute; inset:0; border-radius:9999px;
    background:#10b981; opacity:.6; animation:pulse 2s ease-out infinite;
  }
  @keyframes pulse {
    0%{transform:scale(1);opacity:.6}
    100%{transform:scale(2.5);opacity:0}
  }

  .reveal { opacity:0; transform: translateY(20px); transition: opacity .8s ease, transform .8s ease; }
  .reveal.in { opacity:1; transform: translateY(0); }

  /* Stat number gradient */
  .stat-num {
    background: linear-gradient(180deg, #ffffff 0%, #89AACC 100%);
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-fill-color: transparent;
            color: transparent;
  }

  .accent-rule {
    background: linear-gradient(90deg, #89AACC 0%, transparent 100%);
    height: 1px;
  }

  /* Pull-quote */
  .pullquote::before { content: '“'; }
  .pullquote::after { content: '”'; }

  /* Inline case-study media (legacy) */
  .cs-media {
    display: block;
    margin: 28px 0 0;
    width: 100%;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid hsl(var(--stroke));
    background: hsl(var(--surface));
    box-shadow: 0 22px 50px rgba(0,0,0,0.45);
  }
  .cs-media video, .cs-media img { width: 100%; height: auto; display: block; }
  .cs-media-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    margin-top: 28px;
  }
  .cs-media-row img {
    width: 100%;
    border-radius: 18px;
    border: 1px solid hsl(var(--stroke));
    box-shadow: 0 14px 30px rgba(0,0,0,0.35);
  }
  /* JS wraps each loose row image so it can host its own shimmer */
  .cs-media-cell { position: relative; border-radius: 18px; display: block; }
  .cs-media-cell img { margin: 0; }

  /* Section-level media (new: leads each section) */
  .cs-section { display: grid; gap: 32px; }
  @media (min-width: 768px) { .cs-section { gap: 48px; } }
  .cs-section-media {
    position: relative;
    width: 100%;
    border-radius: 24px;
    overflow: hidden;
    border: 1px solid hsl(var(--stroke));
    background: hsl(var(--surface));
    box-shadow: 0 30px 70px rgba(0,0,0,0.5);
  }
  .cs-section-media > img,
  .cs-section-media > video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }
  .cs-section-media.wide { aspect-ratio: 16/9; }
  .cs-section-media.cinema { aspect-ratio: 21/9; }
  .cs-section-media.square { aspect-ratio: 1/1; }
  .cs-section-media.tall { aspect-ratio: 4/5; }
  /* OpenSky drone video is natively 1468×1198 — match it so the frame fills without bars */
  .cs-section-media.opensky { aspect-ratio: 1468/1198; }
  .cs-section-media.kenburns > img { animation: kenburns 22s ease-in-out infinite alternate; }

  /* YouTube cinemagraph: oversize the iframe so all YT chrome falls outside the visible area */
  .cs-section-media iframe.yt-bg {
    position: absolute;
    top: -8%; left: -8%;
    width: 116%; height: 116%;
    border: 0;
    pointer-events: none;
  }
  @keyframes kenburns {
    0%   { transform: scale(1) translate(0, 0); }
    100% { transform: scale(1.08) translate(-2%, 1%); }
  }
  .cs-section-media .cs-media-caption {
    position: absolute;
    left: 22px; bottom: 18px; right: 22px;
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.85);
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    z-index: 2;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    pointer-events: none;
  }
  .cs-section-media .cs-media-gradient {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
    pointer-events: none;
    z-index: 1;
  }

  /* Section-level gallery grid (multi-image, autoplays via hover scale) */
  .cs-section-gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  @media (max-width: 640px) {
    .cs-section-gallery { grid-template-columns: repeat(2, 1fr); }
  }
  .cs-section-gallery .cs-tile {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid hsl(var(--stroke));
    background: hsl(var(--surface));
    aspect-ratio: 3/4;
    box-shadow: 0 18px 40px rgba(0,0,0,0.4);
  }
  .cs-section-gallery .cs-tile img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform .8s ease;
  }
  .cs-section-gallery .cs-tile:hover img { transform: scale(1.06); }
  .cs-section-gallery.tall .cs-tile { aspect-ratio: 9/16; }
  .cs-section-gallery.square .cs-tile { aspect-ratio: 1/1; }

  /* iPhone gallery: let source images keep their own frames; just normalize spacing/shadow. */
  .cs-section-gallery.iphone {
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    background: transparent;
  }
  @media (max-width: 640px) {
    .cs-section-gallery.iphone { grid-template-columns: repeat(3, 1fr); gap: 12px; }
  }
  .cs-section-gallery.iphone .cs-tile {
    aspect-ratio: 9/19.5;
    background: transparent;
    border: 0;
    border-radius: 0;
    overflow: visible;
    box-shadow: none;
  }
  .cs-section-gallery.iphone .cs-tile img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
    border-radius: 0;
    background: transparent;
    filter: drop-shadow(0 22px 40px rgba(0,0,0,0.55));
  }
  .cs-section-gallery.iphone .cs-tile:hover img { transform: none; }

  /* Gated case study request form */
  .cs-gate-form { max-width: 100%; }
  .cs-gate-field { display: block; }
  .cs-gate-label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: hsl(var(--muted));
    margin-bottom: 10px;
  }
  .cs-gate-label em {
    font-style: normal;
    color: hsl(var(--muted) / 0.7);
    margin-left: 4px;
    text-transform: none;
    letter-spacing: 0.05em;
  }
  .cs-gate-field input,
  .cs-gate-field textarea {
    width: 100%;
    background: hsl(var(--surface));
    border: 1px solid hsl(var(--stroke));
    border-radius: 14px;
    padding: 14px 16px;
    color: hsl(var(--text));
    font: inherit;
    font-size: 15px;
    transition: border-color .2s ease, background .2s ease;
    outline: none;
  }
  .cs-gate-field textarea { resize: vertical; min-height: 96px; }
  .cs-gate-field input:focus,
  .cs-gate-field textarea:focus {
    border-color: rgba(137,170,204,0.6);
    background: hsl(var(--surface) / 1.2);
  }
  .cs-gate-submit {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(90deg, #89AACC 0%, #4E85BF 100%);
    color: #0a0a0a;
    border: 0;
    padding: 16px 32px;
    border-radius: 9999px;
    font: inherit;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: transform .25s ease, filter .25s ease;
  }
  .cs-gate-submit:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .cs-gate-submit:disabled { opacity: .6; cursor: progress; transform: none; }
  .cs-gate-success {
    margin-top: 18px;
    padding: 14px 18px;
    border-radius: 14px;
    border: 1px solid rgba(16,185,129,0.4);
    background: rgba(16,185,129,0.08);
    color: hsl(var(--text));
    font-size: 14px;
  }

  /* Full-bleed intermission strip between cases */
  .cs-bleed {
    position: relative;
    width: 100vw;
    margin-left: calc(50% - 50vw);
    border-top: 1px solid hsl(var(--stroke));
    border-bottom: 1px solid hsl(var(--stroke));
    overflow: hidden;
    background: hsl(var(--surface));
  }
  .cs-bleed.wide-aspect { aspect-ratio: 21/9; }
  .cs-bleed > img,
  .cs-bleed > video {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .cs-bleed > img { animation: kenburns 28s ease-in-out infinite alternate; }

  /* App CTA button */
  .cs-app-cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 26px;
    border-radius: 9999px;
    background: hsl(var(--text));
    color: hsl(var(--bg));
    font-weight: 500;
    text-decoration: none;
    font-size: 15px;
    transition: transform .25s ease, filter .25s ease;
  }
  .cs-app-cta:hover { transform: translateY(-2px); filter: brightness(1.05); }
  .cs-app-cta-wrap {
    display: flex;
    justify-content: center;
    margin-top: 16px;
  }

  /* Lite YouTube embed */
  .yt-lite {
    display: block;
    position: relative;
    aspect-ratio: 16 / 9;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid hsl(var(--stroke));
    background: #111;
    cursor: pointer;
    transition: transform .4s ease, border-color .4s ease;
    text-decoration: none;
    margin-top: 24px;
  }
  .yt-lite:hover { transform: scale(1.01); border-color: rgba(137,170,204,0.5); }
  .yt-lite img.poster {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform .6s ease;
  }
  .yt-lite:hover img.poster { transform: scale(1.04); }
  .yt-lite .yt-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.0) 0%, rgba(0,0,0,0.45) 100%);
    display: flex; align-items: center; justify-content: center;
    transition: background .3s ease;
  }
  .yt-play {
    width: 72px; height: 72px;
    border-radius: 9999px;
    background: linear-gradient(135deg, #89AACC, #4E85BF);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 36px rgba(78,133,191,0.45), 0 0 0 6px rgba(255,255,255,0.05);
    transition: transform .25s ease;
  }
  .yt-lite:hover .yt-play { transform: scale(1.08); }
  .yt-play svg { width: 28px; height: 28px; fill: #fff; margin-left: 5px; }
  .yt-meta {
    position: absolute;
    bottom: 18px;
    left: 20px; right: 20px;
    color: rgba(255,255,255,0.92);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    display: flex; justify-content: space-between; align-items: center;
    font-style: normal;
  }

  /* ============ SKELETON LOADER — rainbow shine sweep ============ */
  /* A soft rainbow band sweeps across a dark placeholder while the image
     loads, then crossfades out once it fires `load`. */
  .skel { isolation: isolate; }
  .skel::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 20;
    border-radius: inherit;
    pointer-events: none;
    background:
      linear-gradient(90deg,
        rgba(255,107,157,0)   0%,
        rgba(255,107,157,.42) 14%,
        rgba(199,121,255,.42) 28%,
        rgba(107,157,255,.42) 42%,
        rgba(107,217,197,.42) 56%,
        rgba(255,217,102,.42) 70%,
        rgba(255,140,107,.42) 84%,
        rgba(255,107,157,0)  100%);
    background-color: hsl(var(--surface));
    background-size: 220% 100%;
    background-repeat: no-repeat;
    background-position: -120% 0;
    animation: skelSweep 1.8s linear infinite;
    transition: opacity .55s ease;
  }
  .skel.loaded::after { opacity: 0; animation: none; }
  @keyframes skelSweep {
    0%   { background-position: -120% 0; }
    100% { background-position:  220% 0; }
  }
  .skel-img, .skel-vid { opacity: 0; transition: opacity .6s ease; }
  .skel-img.loaded, .skel-vid.loaded { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    .skel::after { animation: none; }
  }
</style>
</head>

<script>
const CASES = {
  'linkedin-premium': {
    name: 'LinkedIn Premium',
    category: 'Mobile · 2022–Present',
    role: 'Design Lead, Premium Mobile',
    team: 'Cross-functional pod: PM, eng, data science, research',
    location: 'Sunnyvale, CA',
    headline: 'Reimagining premium mobile at hundreds-of-millions scale in the AI era.',
    hero: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055344_5eff02e0-87a5-41ce-b64f-eb08da8f33db.png&w=1280&q=85',
    stats: [
      { k: 'Members reached', v: '100M+' },
      { k: 'AI-native concepts shipped to test', v: '20+' },
      { k: 'Avg. concept-to-prototype', v: '< 24h' },
    ],
    sections: [
      {
        h: 'Context',
        media: `<img loading="lazy" src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055344_5eff02e0-87a5-41ce-b64f-eb08da8f33db.png&w=1600&q=85" alt="LinkedIn Premium"/>`,
        mediaClass: 'kenburns cinema',
        mediaCaption: 'LinkedIn Premium · Mobile',
        body: `Premium is one of the largest subscription products in the world, with hundreds of millions of professionals. By 2023 the question wasn't whether AI would change Premium, but how to design a product where the most valuable feature might be a conversation, a coach, or a forecast, not a feed.`
      },
      {
        h: 'LinkedIn × Calendly',
        media: `<img loading="lazy" src="https://images.ctfassets.net/k0lk9kiuza3o/7heMHsZRy4PYeWnwwgTVev/6b7c2595a59e93b9d7bb3c40db67310e/LinkedIn-Blue-128_2x_1.svg" alt="LinkedIn × Calendly integration" style="background:#fff; padding:120px; object-fit:contain;"/>`,
        mediaClass: 'wide',
        mediaCaption: 'Calendly × LinkedIn · Shipped integration',
        body: `<strong class="text-text-primary">Book an appointment, directly from a Premium profile.</strong> I partnered with Calendly on a shipped integration that turns a Premium profile into a real conversion surface, a "Book an appointment" button plus a browser extension that drops scheduling links into Messaging, Sales Navigator, and Recruiter without switching tabs.<br/><br/>The design problem: make a third-party action feel native to LinkedIn. Button reads as LinkedIn surface, booking flow reads as Calendly trust. <a href="https://calendly.com/integration/linkedin" target="_blank" rel="noopener" style="color:#89AACC; text-decoration:underline;">View the integration ↗</a>`
      },
      {
        h: 'Process',
        body: `<strong class="text-text-primary">Prototype before brief.</strong> Instead of starting with a doc and ending with a screen, I start with the screen. AI-native tooling lets me ship a clickable, opinionated artifact in hours, something the team can react to, not just read.<br/><br/><strong class="text-text-primary">Pressure-test in the wild.</strong> Concepts get tested with cross-functional partners, not socialized in slides. The bar is "would you use it" not "would you approve it."`
      },
      {
        h: 'Key decisions',
        body: `<strong class="text-text-primary">Design the value, not the wall.</strong> Premium products often optimize the paywall. I push the team to design what's behind it, the moment of help, first.<br/><br/><strong class="text-text-primary">AI as calm collaborator.</strong> Generative features can feel slot-machine-y. I design for predictable interactions where the AI's job is clearly scoped and its limits are honest.`
      },
      {
        h: 'Outcomes',
        body: `Premium concepts I led drove meaningful engagement and monetization lifts in shipped experiments. The prototyping rhythm I introduced is now used across the broader Premium design org. Faster decisions, higher craft, fewer slide reviews.`
      }
    ],
    quote: 'Prototype before brief.',
    next: 'wing',
    appUrl: 'https://www.linkedin.com/premium/',
    appLabel: 'Try LinkedIn Premium',
    gated: true,
    gatedIntro: `Thanks for your interest. If you'd like to view it, share your name and email and I'll happily provide access.`,
  },

        body: `Constraints shaped every design call.<br/><br/><strong class="text-text-primary">Regulatory.</strong> The FAA had to be able to read what the customer was being shown. That ruled out any UI that anthropomorphized the drone or implied autonomy beyond what was approved. Words like "your drone" were OK; words like "she's on her way" were not.<br/><br/><strong class="text-text-primary">Hardware.</strong> The drone's behavior was deterministic but constrained. It couldn't hover indefinitely. It couldn't re-attempt a delivery after a certain wind speed. We couldn't ask the customer to "wait a few more minutes", the aircraft had to leave.<br/><br/><strong class="text-text-primary">Mental model.</strong> Most people had never looked up at the sky in a delivery context. Diary studies showed customers expected the drone to behave like a courier (drives, waits, knocks). We had to teach a new metaphor without making the product feel weird.<br/><br/><strong class="text-text-primary">Trust ceiling.</strong> An anxious user wants to know what's happening overhead. Hide the drone, and the customer panics. Show too much, and they don't understand what they're seeing. We had to draw a line in the middle.`

        mediaClass: 'kenburns wide',
        body: `<strong class="text-text-primary">Decision:</strong> design the abort states before designing the happy path.<br/><br/><strong class="text-text-primary">Why.</strong> A drone delivery has more abort states than a normal order: weather aborts, wind aborts, payload-attachment failures, late tether captures, regulatory holds, returns. In early prototypes, the abort copy was added as an afterthought. Customer trust collapsed every time. People interpreted any abort as "the drone is broken and might be over my house."<br/><br/><strong class="text-text-primary">What we changed.</strong> We rewrote every abort state into the customer's frame, not the operator's. "Your order is delayed because of wind. We'll return it to the store and reorder for you" instead of "Aborted: wind speed exceeded threshold." We added a refund or rebook action in the same screen, so the abort didn't feel like a dead end. Trust scores in user testing went from "I'm nervous" to "OK, that makes sense" within one design round.<br/><br/><strong class="text-text-primary">Trade-off.</strong> This meant slowing down the happy-path polish for a quarter. It paid off; we spent the saved time on the doorstep moment, which became the product's signature.`

            ${c.appUrl ? `
              <section class="reveal cs-app-cta-wrap">
                <a href="${c.appUrl}" target="_blank" rel="noopener" class="cs-app-cta">
                  ${c.appLabel || 'Open the app'} <span aria-hidden="true">↗</span>
                </a>
              </section>
            ` : ''}

            <!-- Pull quote -->
            <section class="reveal py-12 md:py-16 border-y" style="border-color:hsl(var(--stroke))">
              <p class="pullquote text-3xl md:text-5xl lg:text-6xl font-display italic leading-tight max-w-4xl mx-auto text-center" style="color:hsl(var(--text))">
                ${c.quote}
              </p>
            </section>
          `}
        </div>
      </div>
    </article>
  `;

  // wire next link
  const next = CASES[c.next];
  document.getElementById('nextLink').href = '#' + c.next;
  document.getElementById('nextName').innerHTML = `<span class="font-display italic">${next.name}</span> →`;
  document.getElementById('nextCat').textContent = next.category;

  // gated request form: submit via mailto
  const form = document.getElementById('caseStudyRequest');
  if (form) {
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const firstName = (fd.get('firstName') || '').toString().trim();
      const lastName  = (fd.get('lastName')  || '').toString().trim();
      const email     = (fd.get('email')     || '').toString().trim();
      const company   = (fd.get('company')   || '').toString().trim();
      const note      = (fd.get('note')      || '').toString().trim();
      if (!firstName || !lastName || !email) { form.reportValidity(); return; }
      const subject = encodeURIComponent(`Case study access request — ${c.name}`);
      const lines = [
        `Hi Joey,`,
        ``,
        `I'd like access to the ${c.name} case study.`,
        ``,
        `Name: ${firstName} ${lastName}`,
        `Email: ${email}`,
        company ? `Company: ${company}` : null,
        note ? `\nNote:\n${note}` : null,
      ].filter(Boolean).join('\n');
      window.location.href = `mailto:jprimiani@gmail.com?subject=${subject}&body=${encodeURIComponent(lines)}`;
      const success = form.querySelector('.cs-gate-success');
      if (success) success.hidden = false;
      const btn = form.querySelector('.cs-gate-submit');
      if (btn) { btn.disabled = true; btn.textContent = 'Request sent ✓'; }
    });
  }

  // skeleton loaders — rainbow shimmer over images until they load
  setupSkeletons(root);

  // reveal animations
  requestAnimationFrame(() => {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('in');
          io.unobserve(e.target);
        }
      });
    }, { rootMargin: '-40px' });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));
  });

  window.scrollTo({ top: 0, behavior: 'instant' });
}

/* ============ SKELETON IMAGE LOADER ============ */
function wireSkel(el){
  if (el.dataset.skelWired) return;
  el.dataset.skelWired = '1';
  const isVideo = el.tagName === 'VIDEO';
  const done = () => {
    el.classList.add('loaded');
    el.closest('.skel')?.classList.add('loaded');
  };
  const ready = isVideo ? el.readyState >= 2 : (el.complete && el.naturalWidth > 0);
  if (ready) { done(); return; }                       // cached → reveal, no flash
  el.addEventListener(isVideo ? 'loadeddata' : 'load', done, { once: true });
  el.addEventListener('error', done, { once: true });  // never trap on a broken src
}
function setupSkeletons(root){
  // Mark host containers that actually contain an image/video
  const host = el => el.classList.add('skel');
  const heroMedia = root.querySelector('.cs-hero-media');
  if (heroMedia && heroMedia.querySelector('img, video')) host(heroMedia);
  root.querySelectorAll('.cs-section-media').forEach(c => {
    if (c.querySelector(':scope > img, :scope > video')) host(c);
  });
  root.querySelectorAll('.cs-section-gallery .cs-tile').forEach(host);
  // Wrap loose inline-row images so each can carry its own shimmer
  root.querySelectorAll('.cs-media-row > img').forEach(img => {
    const cell = document.createElement('div');
    cell.className = 'skel cs-media-cell';
    img.replaceWith(cell);
    cell.appendChild(img);
  });
  // Tag every direct media child of a skel host, then wire load events
  root.querySelectorAll('.skel > img, .skel > video').forEach(el => {
    el.classList.add(el.tagName === 'VIDEO' ? 'skel-vid' : 'skel-img');
    wireSkel(el);
  });
}

function route() {
  const slug = (location.hash || '#linkedin-premium').slice(1);
  render(slug);
}
window.addEventListener('hashchange', route);
route();
</script>
