<style>
  /* Smooth cross-document navigations (home <-> case studies). Ignored where unsupported. */
  @view-transition { navigation: auto; }
  @media (prefers-reduced-motion: reduce) { @view-transition { navigation: none; } }
  ::view-transition-group(*) { animation-duration: .52s; animation-timing-function: cubic-bezier(.5, 0, .12, 1); }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .4s; animation-timing-function: ease-in-out; }

  /* Consistent, branded keyboard focus ring */
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible,
  select:focus-visible, [tabindex="0"]:focus-visible {
    outline: 2px solid #89AACC; outline-offset: 2px; border-radius: 3px;
  }

  :root {
    --bg: 0 0% 4%;
    --surface: 0 0% 8%;
    --text: 0 0% 96%;
    --muted: 0 0% 53%;
    --stroke: 0 0% 12%;
  }
  *,*::before,*::after { box-sizing:border-box; }
  html, body { margin:0; padding:0; }
  body {
    font-family: 'Inter', sans-serif;
    background: hsl(var(--bg));
    color: hsl(var(--text));
    -webkit-font-smoothing: antialiased;
  }
  .font-display { font-family: 'Instrument Serif', serif; }
  .accent-gradient {
    background: linear-gradient(90deg, #89AACC 0%, #4E85BF 100%);
  }
  @keyframes gradient-shift {
    0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}
  }
  .ring-btn { position: relative; isolation: isolate; }
  .ring-btn::before {
    content:''; position:absolute; inset:-2px; border-radius:9999px;
    padding:2px; background:linear-gradient(90deg,#89AACC,#4E85BF,#89AACC);
    background-size:200% 200%; animation:gradient-shift 6s ease infinite;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    opacity:0; transition: opacity .3s ease; z-index:-1;
  }
  .ring-btn:hover::before { opacity:1; }

  .halftone {
    background-image: radial-gradient(circle, #000 1px, transparent 1px);
    background-size: 4px 4px;
  }

  .pulse-dot { position:relative; }
  .pulse-dot::after {
    content:''; position:absolute; inset:0; border-radius:9999px;
    background:#10b981; opacity:.6; animation:pulse 2s ease-out infinite;
  }
  @keyframes pulse {
    0%{transform:scale(1);opacity:.6}
    100%{transform:scale(2.5);opacity:0}
  }

  .reveal { opacity:0; transform: translateY(20px); transition: opacity .8s ease, transform .8s ease; }
  .reveal.in { opacity:1; transform: translateY(0); }

  /* Stat number gradient */
  .stat-num {
    background: linear-gradient(180deg, #ffffff 0%, #89AACC 100%);
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-fill-color: transparent;
            color: transparent;
  }

  .accent-rule {
    background: linear-gradient(90deg, #89AACC 0%, transparent 100%);
    height: 1px;
  }

  /* Pull-quote */
  .pullquote::before { content: '“'; }
  .pullquote::after { content: '”'; }

  /* Inline case-study media (legacy) */
  .cs-media {
    display: block;
    margin: 28px 0 0;
    width: 100%;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid hsl(var(--stroke));
    background: hsl(var(--surface));
    box-shadow: 0 22px 50px rgba(0,0,0,0.45);
  }
  .cs-media video, .cs-media img { width: 100%; height: auto; display: block; }
  .cs-media-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    margin-top: 28px;
  }
  .cs-media-row img {
    width: 100%;
    border-radius: 18px;
    border: 1px solid hsl(var(--stroke));
    box-shadow: 0 14px 30px rgba(0,0,0,0.35);
  }
  /* JS wraps each loose row image so it can host its own shimmer */
  .cs-media-cell { position: relative; border-radius: 18px; display: block; }
  .cs-media-cell img { margin: 0; }

  /* Section-level media (new: leads each section) */
  .cs-section { display: grid; gap: 32px; }
  .cs-section p a { color: hsl(var(--text)); font-weight: 700; text-decoration: none; transition: opacity .2s ease; }
  .cs-section p a:hover { text-decoration: underline; text-underline-offset: 2px; }
  /* On mobile the ↗ renders as an iOS emoji; hide it (kept on desktop). */
  @media (max-width: 640px) { .ui-arrow { display: none; } }
  @media (min-width: 768px) { .cs-section { gap: 48px; } }
  .cs-section-media {
    position: relative;
    width: 100%;
    border-radius: 24px;
    overflow: hidden;
    border: 1px solid hsl(var(--stroke));
    background: hsl(var(--surface));
    box-shadow: 0 30px 70px rgba(0,0,0,0.5);
  }
  .cs-section-media > img,
  .cs-section-media > video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }
  .cs-section-media.wide { aspect-ratio: 16/9; }
  .cs-section-media.cinema { aspect-ratio: 21/9; }
  .cs-section-media.square { aspect-ratio: 1/1; }
  .cs-section-media.tall { aspect-ratio: 4/5; }
  /* OpenSky drone video is natively 1468×1198, match it so the frame fills without bars */
  .cs-section-media.opensky { aspect-ratio: 1468/1198; }
  .cs-section-media.poly { aspect-ratio: 1280/826; }   /* polygon flight-planning recording */
  .cs-section-media.flightplan { aspect-ratio: 1999/1158; }   /* lane-by-lane altitude-coded flight plan */
  .cs-section-media.calendly { aspect-ratio: 1/1; max-width: 460px; margin-inline: auto; background: #ffffff; }   /* LinkedIn × Calendly demo, clean white, no texture */
  .cs-section-media.triptych { aspect-ratio: 933 / 504; }   /* Entangled 3 screens, cut sharp (no device shadows) */
  .cs-section-media.coverphotos { aspect-ratio: 824 / 640; }   /* LinkedIn cover-photo slideshow recording */
  /* iPhone 17 Pro frame (screen clipped by CSS, bezel PNG on top), same geometry as the home tiles */
  .cs-frame { position: relative; aspect-ratio: 1752/3616; }
  .cs-frame .cs-frame-clip { position: absolute; left: 4.17%; top: 1.74%; width: 91.6%; height: 96.5%; border-radius: 9% / 4.4%; overflow: hidden; z-index: 1; }
  .cs-frame .cs-frame-clip > video, .cs-frame .cs-frame-clip > img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cs-frame .cs-frame-bezel { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
  .cs-section-media.phone-frame { aspect-ratio: auto; height: auto; display: flex; justify-content: center; padding: 64px 0; }
  .cs-section-media.phone-frame .cs-frame { height: min(74vh, 680px); }
  .cs-hero-media.is-frame { display: flex; align-items: center; justify-content: center; }
  .cs-hero-media.is-frame .cs-frame { height: 84%; }
  .cs-section-media.kenburns > img { animation: kenburns 22s ease-in-out infinite alternate; }

  /* YouTube cinemagraph: oversize the iframe so all YT chrome falls outside the visible area */
  .cs-section-media iframe.yt-bg {
    position: absolute;
    top: -8%; left: -8%;
    width: 116%; height: 116%;
    border: 0;
    pointer-events: none;
  }
  @keyframes kenburns {
    0%   { transform: scale(1) translate(0, 0); }
    100% { transform: scale(1.08) translate(-2%, 1%); }
  }
  .cs-section-media .cs-media-caption {
    position: absolute;
    left: 22px; bottom: 18px; right: 22px;
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.85);
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    z-index: 2;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    pointer-events: none;
  }
  .cs-section-media .cs-media-gradient {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
    pointer-events: none;
    z-index: 1;
  }
  /* Transparent device render floating on the themed surface (adapts dark/light) */
  .cs-section-media.device-pad { background: hsl(var(--surface)); }
  .cs-section-media.device-pad > img { object-fit: contain; padding: 4% 5%; }

  /* Section-level gallery grid (multi-image, autoplays via hover scale) */
  .cs-section-gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  @media (max-width: 640px) {
    .cs-section-gallery { grid-template-columns: repeat(2, 1fr); }
  }
  .cs-section-gallery .cs-tile {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid hsl(var(--stroke));
    background: hsl(var(--surface));
    aspect-ratio: 3/4;
    box-shadow: 0 18px 40px rgba(0,0,0,0.4);
  }
  .cs-section-gallery .cs-tile img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform .8s ease;
  }
  .cs-section-gallery .cs-tile:hover img { transform: scale(1.06); }
  .cs-section-gallery.tall .cs-tile { aspect-ratio: 9/16; }
  .cs-section-gallery.square .cs-tile { aspect-ratio: 1/1; }
  /* full-width stacked screenshots (no crop) */
  .cs-section-gallery.fullwidth { grid-template-columns: 1fr; gap: 18px; }
  .cs-section-gallery.fullwidth .cs-tile { aspect-ratio: auto; background: #ffffff; }
  .cs-section-gallery.fullwidth .cs-tile img { height: auto; object-fit: contain; }
  @media (max-width: 640px) { .cs-section-gallery.fullwidth { grid-template-columns: 1fr; } }

  /* ===== Lookbook rail: horizontal scroll carousel with center-focus spotlight ===== */
  .cs-hscroll-wrap { position: relative; margin-top: 10px; }
  .cs-hscroll {
    display: flex; gap: 22px; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x proximity; scroll-behavior: smooth;
    padding: 22px 2px 26px; -webkit-overflow-scrolling: touch;
    scrollbar-width: none; cursor: grab;
    -webkit-mask: linear-gradient(90deg, transparent 0, #000 5%, #000 95%, transparent 100%);
            mask: linear-gradient(90deg, transparent 0, #000 5%, #000 95%, transparent 100%);
  }
  .cs-hscroll::-webkit-scrollbar { display: none; }
  .cs-hscroll.dragging { cursor: grabbing; scroll-behavior: auto; scroll-snap-type: none; }
  .cs-hslide {
    flex: 0 0 auto; height: clamp(340px, 54vh, 500px); margin: 0;
    scroll-snap-align: center; border-radius: 20px; overflow: hidden;
    border: 1px solid hsl(var(--stroke));
    box-shadow: 0 26px 60px rgba(0,0,0,.45);
    transform: scale(var(--s, 1)); opacity: var(--o, 1);
    transition: transform .6s cubic-bezier(.22,.61,.36,1), opacity .6s ease, box-shadow .6s ease;
    will-change: transform;
  }
  .cs-hslide img {
    height: 100%; width: auto; display: block; object-fit: cover;
    pointer-events: none; user-select: none; -webkit-user-drag: none;
    transition: transform 1s cubic-bezier(.22,.61,.36,1);
  }
  .cs-hslide:hover { box-shadow: 0 34px 80px rgba(0,0,0,.55); }
  .cs-hslide:hover img { transform: scale(1.05); }
  .cs-hscroll-bar { height: 2px; width: 120px; margin: 4px auto 0; background: hsl(var(--stroke)); border-radius: 2px; overflow: hidden; }
  .cs-hscroll-fill { display: block; height: 100%; width: 100%; transform-origin: left center; transform: scaleX(.07); background: hsl(var(--text)); transition: transform .15s ease-out; }
  /* staggered entrance as the section reveals */
  .reveal:not(.in) .cs-hslide { opacity: 0; }
  .reveal.in .cs-hslide { animation: hsIn .7s cubic-bezier(.22,.61,.36,1) backwards; animation-delay: calc(var(--i, 0) * .07s); }
  @keyframes hsIn { from { opacity: 0; transform: translateY(30px) scale(.93); } to { opacity: 1; transform: none; } }
  html[data-theme="light"] .cs-hslide { box-shadow: 0 22px 50px rgba(90,75,55,0.16); }
  @media (prefers-reduced-motion: reduce) {
    .cs-hscroll { scroll-behavior: auto; }
    .reveal.in .cs-hslide { animation: none; }
    .cs-hslide { transition: none; transform: none !important; opacity: 1 !important; }
    .cs-hslide:hover img { transform: none; }
  }

  /* app-screen mockups: 2-up, keep their own device framing */
  .cs-section-gallery.appshots { grid-template-columns: repeat(2, 1fr); gap: 18px; }
  .cs-section-gallery.appshots .cs-tile { aspect-ratio: 4/3; background: hsl(var(--surface)); }
  .cs-section-gallery.appshots .cs-tile img { object-fit: cover; }
  @media (max-width: 640px) { .cs-section-gallery.appshots { grid-template-columns: 1fr; } }

  /* iPhone gallery: let source images keep their own frames; just normalize spacing/shadow. */
  .cs-section-gallery.iphone {
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    background: transparent;
  }
  @media (max-width: 640px) {
    .cs-section-gallery.iphone { grid-template-columns: repeat(3, 1fr); gap: 12px; }
  }
  .cs-section-gallery.iphone .cs-tile {
    aspect-ratio: 9/19.5;
    background: transparent;
    border: 0;
    border-radius: 0;
    overflow: visible;
    box-shadow: none;
  }
  .cs-section-gallery.iphone .cs-tile img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
    border-radius: 0;
    background: transparent;
    filter: drop-shadow(0 22px 40px rgba(0,0,0,0.55));
  }
  .cs-section-gallery.iphone .cs-tile:hover img { transform: none; }

  /* Gated case study request form */
  .cs-gate-form { max-width: 100%; }
  .cs-gate-field { display: block; }
  .cs-gate-label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: hsl(var(--muted));
    margin-bottom: 10px;
  }
  .cs-gate-label em {
    font-style: normal;
    color: hsl(var(--muted) / 0.7);
    margin-left: 4px;
    text-transform: none;
    letter-spacing: 0.05em;
  }
  .cs-gate-field input,
  .cs-gate-field textarea {
    width: 100%;
    background: hsl(var(--surface));
    border: 1px solid hsl(var(--stroke));
    border-radius: 14px;
    padding: 14px 16px;
    color: hsl(var(--text));
    font: inherit;
    font-size: 15px;
    transition: border-color .2s ease, background .2s ease;
    outline: none;
  }
  .cs-gate-field textarea { resize: vertical; min-height: 96px; }
  .cs-gate-field input:focus,
  .cs-gate-field textarea:focus {
    border-color: rgba(137,170,204,0.6);
    background: hsl(var(--surface) / 1.2);
  }
  /* Keep browser-autofilled fields on the dark theme (override the light autofill bg) */
  .cs-gate-field input:-webkit-autofill,
  .cs-gate-field input:-webkit-autofill:hover,
  .cs-gate-field input:-webkit-autofill:focus,
  .cs-gate-field textarea:-webkit-autofill {
    -webkit-text-fill-color: hsl(var(--text));
    -webkit-box-shadow: 0 0 0 1000px hsl(var(--surface)) inset;
            box-shadow: 0 0 0 1000px hsl(var(--surface)) inset;
    caret-color: hsl(var(--text));
    transition: background-color 9999s ease-in-out 0s;
  }
  .cs-gate-submit {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(90deg, #89AACC 0%, #4E85BF 100%);
    color: #0a0a0a;
    border: 0;
    padding: 16px 32px;
    border-radius: 9999px;
    font: inherit;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: transform .25s ease, filter .25s ease;
  }
  .cs-gate-submit:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .cs-gate-submit:disabled { opacity: .6; cursor: progress; transform: none; }
  .cs-gate-success {
    margin-top: 18px;
    padding: 14px 18px;
    border-radius: 14px;
    border: 1px solid rgba(16,185,129,0.4);
    background: rgba(16,185,129,0.08);
    color: hsl(var(--text));
    font-size: 14px;
  }

  /* Full-bleed intermission strip between cases */
  .cs-bleed {
    position: relative;
    width: 100vw;
    margin-left: calc(50% - 50vw);
    border-top: 1px solid hsl(var(--stroke));
    border-bottom: 1px solid hsl(var(--stroke));
    overflow: hidden;
    background: hsl(var(--surface));
  }
  .cs-bleed.wide-aspect { aspect-ratio: 21/9; }
  .cs-bleed > img,
  .cs-bleed > video {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .cs-bleed > img { animation: kenburns 28s ease-in-out infinite alternate; }

  /* App CTA button */
  .cs-app-cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 26px;
    border-radius: 9999px;
    background: hsl(var(--text));
    color: hsl(var(--bg));
    font-weight: 500;
    text-decoration: none;
    font-size: 15px;
    transition: transform .25s ease, filter .25s ease;
  }
  .cs-app-cta:hover { transform: translateY(-2px); filter: brightness(1.05); }
  .cs-app-cta-wrap {
    display: flex;
    justify-content: center;
    margin-top: 16px;
  }

  /* Lite YouTube embed */
  .yt-lite {
    display: block;
    position: relative;
    aspect-ratio: 16 / 9;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid hsl(var(--stroke));
    background: #111;
    cursor: pointer;
    transition: transform .4s ease, border-color .4s ease;
    text-decoration: none;
    margin-top: 24px;
  }
  .yt-lite:hover { transform: scale(1.01); border-color: rgba(137,170,204,0.5); }
  .yt-lite img.poster {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform .6s ease;
  }
  .yt-lite:hover img.poster { transform: scale(1.04); }
  .yt-lite .yt-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.0) 0%, rgba(0,0,0,0.45) 100%);
    display: flex; align-items: center; justify-content: center;
    transition: background .3s ease;
  }
  .yt-play {
    width: 72px; height: 72px;
    border-radius: 9999px;
    background: linear-gradient(135deg, #89AACC, #4E85BF);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 36px rgba(78,133,191,0.45), 0 0 0 6px rgba(255,255,255,0.05);
    transition: transform .25s ease;
  }

  /* ============ SKELETON LOADER, rainbow shine sweep ============ */
  /* A soft rainbow band sweeps across a dark placeholder while the image
     loads, then crossfades out once it fires `load`. */
  .skel { isolation: isolate; }
  .skel::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 20;
    border-radius: inherit;
    pointer-events: none;
    background:
      linear-gradient(90deg,
        rgba(255,107,157,0)   0%,
        rgba(255,107,157,.42) 14%,
        rgba(199,121,255,.42) 28%,
        rgba(107,157,255,.42) 42%,
        rgba(107,217,197,.42) 56%,
        rgba(255,217,102,.42) 70%,
        rgba(255,140,107,.42) 84%,
        rgba(255,107,157,0)  100%);
    background-color: hsl(var(--surface));
    background-size: 220% 100%;
    background-repeat: no-repeat;
    background-position: -120% 0;
    animation: skelSweep 1.8s linear infinite;
    transition: opacity .55s ease;
  }
  .skel.loaded::before { opacity: 0; animation: none; }
  @keyframes skelSweep {
    0%   { background-position: -120% 0; }
    100% { background-position:  220% 0; }
  }
  /* Only images are opacity-gated; videos render normally (their poster is
     the placeholder) so the skeleton can never hide a video. */
  .skel-img { opacity: 0; transition: opacity .6s ease; }
  .skel-img.loaded { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    .skel::before { animation: none; }
  }

        mediaClass: 'wide',
        mediaCaption: 'Wing · in flight',
        body: `<strong class="text-text-primary">Decision:</strong> design the abort states before the happy path. Drone delivery has far more failure modes than a normal order, and early on abort copy was an afterthought, so trust collapsed every time: people read any abort as "the drone is broken and might be over my house." We rewrote every abort in the customer's frame ("Your order is delayed because of wind. We'll reorder for you") with a refund or rebook in the same screen. Test sentiment moved from "I'm nervous" to "OK, that makes sense" in one round.`
      },
      {
        h: 'Lean on the courier metaphor',
        body: `<strong class="text-text-primary">Decision:</strong> frame the drone in the food-delivery model people already had, instead of teaching a new one. It fought the instinct to lead with "futuristic autonomous aircraft," but "your courier is nearby, at the door" needed no explanation. We kept the language pedestrian and saved the wow for the doorstep, where the drone descending on its tether did the heavy lifting.`
      },
      {
        h: 'Outcomes',
        body: `<strong class="text-text-primary">Shipped to the first FAA-approved drone delivery in the U.S.</strong>, live deployments serving real food and medications in real neighborhoods. The "show the drone" live view became the most-used screen, and abort flows stopped generating support tickets within a design round. The consumer-trust model became a reference for later Alphabet aerial-delivery work.`
      }
    ],

        mediaClass: 'wide',
        mediaCaption: 'Predicted response · everyday logging',
        body: `<strong class="text-text-primary">The model isn&rsquo;t instant, so the wait means something.</strong> I designed the scan as three beats, <em>capture → recognize → predict</em>, each revealing the next thing the AI actually knows. Latency you can&rsquo;t remove, you narrate.`

    const desc = `${c.role}. ${c.headline.replace(/<[^>]+>/g,'')} A case study by Joey Primiani.`;

    set('meta[property="og:description"]', 'content', desc);
    set('meta[property="og:url"]', 'content', url);

  })();

  // Reusable request-access gate (used full-page when c.gated, or appended at the end when c.gateAtEnd)

          <span class="cs-gate-label">Email <em>(Required)</em></span>
          <input required name="email" type="email" autocomplete="email"/>
        </label>
        <label class="cs-gate-field mt-4 md:mt-5 block">
          <span class="cs-gate-label">Company</span>
          <input name="company" type="text" autocomplete="organization"/>

        <label class="cs-gate-field mt-4 md:mt-5 block">
          <span class="cs-gate-label">Note</span>
          <textarea name="note" rows="3" placeholder="What about the work caught your eye?"></textarea>

          Send request <span class="ui-arrow" aria-hidden="true">↗</span>

        <p class="cs-gate-error" hidden style="color:#ef4444; margin-top:0.75rem">Something went wrong sending your request, please email <a href="mailto:jprimiani@gmail.com" style="text-decoration:underline">jprimiani@gmail.com</a> directly.</p>

          ${c.heroFrame

          ${c.gated ? gateBlock('Request <span class="font-display italic">Case Study</span>', c.gatedIntro || "Thanks for your interest. Share your name and email and I'll happily provide access.", false) : `

                ${s.gallery ? `
                  <div class="cs-section-gallery ${s.galleryClass || ''}">
                    ${s.gallery.map(g => `<div class="cs-tile"><img loading="lazy" src="${g}" alt=""/></div>`).join('')}
                  </div>
                ` : ''}
                ${s.hscroll ? `
                  <div class="cs-hscroll-wrap">
                    <div class="cs-hscroll">
                      ${s.hscroll.map((g, gi) => `<figure class="cs-hslide" style="--i:${gi}"><img loading="lazy" src="${g}" alt=""/></figure>`).join('')}

                    <div class="cs-hscroll-bar"><span class="cs-hscroll-fill"></span></div>

                    <div class="text-xs uppercase tracking-[0.3em] mb-2" style="color:hsl(var(--muted))">0${i+1}</div>
                    <h2 class="text-2xl md:text-3xl" style="color:hsl(var(--text))">

                        ? s.h.split(' ').map((w, wi)=> wi === s.h.split(' ').length-1 ? `<span class="font-display italic">${w}</span>` : w).join(' ')
                        : `<span class="font-display italic">${s.h}</span>`}

            ${c.appUrl ? `

  // wire next link
  const next = CASES[c.next];

  document.getElementById('nextName').innerHTML = `<span class="font-display italic">${next.name}</span> →`;
  document.getElementById('nextCat').textContent = next.category;

  // gated request form: submit to Cloudflare Worker at /api/case-study-request
  const form = document.getElementById('caseStudyRequest');
  if (form) {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const firstName = (fd.get('firstName')   || '').toString().trim();
      const lastName  = (fd.get('lastName')    || '').toString().trim();
      const email     = (fd.get('email')       || '').toString().trim();
      const company   = (fd.get('company')     || '').toString().trim();
      const note      = (fd.get('note')        || '').toString().trim();
      const honeypot  = (fd.get('company_url') || '').toString().trim();
      if (!firstName || !lastName || !email) { form.reportValidity(); return; }
      const success = form.querySelector('.cs-gate-success');
      const errorEl = form.querySelector('.cs-gate-error');
      const btn     = form.querySelector('.cs-gate-submit');
      const original = btn ? btn.innerHTML : '';
      if (errorEl) errorEl.hidden = true;
      if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
      try {
        const res = await fetch('/api/case-study-request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            firstName, lastName, email, company, note,
            company_url: honeypot,                          // spam honeypot, must stay empty
            caseStudy: c.name,
            slug: location.hash.replace('#', ''),
          }),
        });
        if (!res.ok) throw new Error('Request failed: ' + res.status);
        if (success) success.hidden = false;
        if (btn) btn.textContent = 'Request sent ✓';
        form.querySelectorAll('input, textarea').forEach((el) => { el.disabled = true; });
      } catch (err) {
        if (btn) { btn.disabled = false; btn.innerHTML = original; }
        if (errorEl) errorEl.hidden = false;
      }
    });
  }

  // skeleton loaders, rainbow shimmer over images until they load
  setupSkeletons(root);

  // animate numeric stats counting up when they enter view
  setupCountUp(root);

  // horizontal lookbook rails: center-focus spotlight, drag / wheel / touch
  setupLookbook(root);

  // reveal animations
  requestAnimationFrame(() => {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('in');
          io.unobserve(e.target);
        }
      });
    }, { rootMargin: '-40px' });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));
  });

  window.scrollTo({ top: 0, behavior: 'instant' });
}

/* ============ SKELETON IMAGE LOADER ============ */
function wireSkel(el){
  if (el.dataset.skelWired) return;
  el.dataset.skelWired = '1';
  const isVideo = el.tagName === 'VIDEO';
  const done = () => {
    el.classList.add('loaded');
    el.closest('.skel')?.classList.add('loaded');
  };
  const ready = isVideo ? el.readyState >= 1 : (el.complete && el.naturalWidth > 0);
  if (ready) { done(); return; }                       // cached / metadata ready → reveal
  if (isVideo) {
    // Videos under file:// often never fire 'loadeddata' (autoplay/load deferred),
    // so reveal on the earliest of several signals.
    ['loadedmetadata', 'loadeddata', 'canplay', 'playing'].forEach(ev =>
      el.addEventListener(ev, done, { once: true }));
  } else {
    el.addEventListener('load', done, { once: true });
  }
  el.addEventListener('error', done, { once: true });  // never trap on a broken src
  setTimeout(done, isVideo ? 2500 : 4000);             // safety net: never stay hidden
}
function setupLookbook(root){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  root.querySelectorAll('.cs-hscroll').forEach(rail => {
    const wrap   = rail.closest('.cs-hscroll-wrap');
    const fill   = wrap ? wrap.querySelector('.cs-hscroll-fill') : null;
    const slides = Array.from(rail.querySelectorAll('.cs-hslide'));
    let raf = 0;

    function update(){
      raf = 0;
      const rRect = rail.getBoundingClientRect();
      const center = rRect.left + rRect.width / 2;
      if (!reduce) {
        slides.forEach(s => {
          const r = s.getBoundingClientRect();
          const c = r.left + r.width / 2;
          const d = Math.min(1, Math.abs(c - center) / (rRect.width * 0.62));   // 0 at center → 1 at edge
          s.style.setProperty('--s', (1 - d * 0.10).toFixed(3));
          s.style.setProperty('--o', (1 - d * 0.42).toFixed(3));
        });
      }
      if (fill){
        const max = rail.scrollWidth - rail.clientWidth;
        const p = max > 0 ? rail.scrollLeft / max : 0;
        fill.style.transform = `scaleX(${Math.max(0.07, Math.min(1, p)).toFixed(3)})`;
      }
    }
    const schedule = () => { if (!raf) raf = requestAnimationFrame(update); };
    rail.addEventListener('scroll', schedule, { passive: true });

    // vertical wheel → horizontal travel (release back to the page at the ends)
    rail.addEventListener('wheel', (e) => {
      if (reduce) return;
      const max = rail.scrollWidth - rail.clientWidth;
      if (max <= 0) return;
      if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;     // trackpad horizontal: let it be
      const atStart = rail.scrollLeft <= 0, atEnd = rail.scrollLeft >= max - 1;
      if ((e.deltaY < 0 && atStart) || (e.deltaY > 0 && atEnd)) return;
      e.preventDefault();
      rail.scrollLeft += e.deltaY;
    }, { passive: false });

    // grab-and-drag
    let down = false, sx = 0, sl = 0;
    rail.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      down = true; sx = e.clientX; sl = rail.scrollLeft; rail.classList.add('dragging');
    });
    rail.addEventListener('pointermove', (e) => { if (down) rail.scrollLeft = sl - (e.clientX - sx); });
    const end = () => { if (down){ down = false; rail.classList.remove('dragging'); } };
    rail.addEventListener('pointerup', end);
    rail.addEventListener('pointercancel', end);
    rail.addEventListener('pointerleave', end);

    const onResize = () => {
      if (!document.body.contains(rail)) { window.removeEventListener('resize', onResize); return; }
      update();
    };
    window.addEventListener('resize', onResize);
    requestAnimationFrame(() => { update(); requestAnimationFrame(update); });
  });
}
function setupCountUp(root){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const nums = root.querySelectorAll('.stat-num');
  nums.forEach(el => {
    const raw = el.textContent.trim();
    // Parse a leading number (with optional decimal/comma); keep any prefix/suffix (e.g. $, M+, ★).
    const m = raw.match(/^([^\d]*)([\d.,]+)(.*)$/);
    if (!m) return;                       // text-only stat (e.g. "First in the U.S."), leave as is
    const pre = m[1], numStr = m[2], suf = m[3];
    const target = parseFloat(numStr.replace(/,/g, ''));
    if (!isFinite(target)) return;
    const decimals = (numStr.split('.')[1] || '').length;
    if (reduce) return;
    el.dataset.final = raw;
    el.textContent = pre + (decimals ? (0).toFixed(decimals) : '0') + suf;
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        io.disconnect();
        const dur = 1100, t0 = performance.now();
        const fmt = v => v.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
        function frame(t){
          const p = Math.min(1, (t - t0) / dur);
          const eased = 1 - Math.pow(1 - p, 3);   // ease-out cubic
          el.textContent = pre + fmt(target * eased) + suf;
          if (p < 1) requestAnimationFrame(frame);
          else el.textContent = el.dataset.final;  // restore exact original string
        }
        requestAnimationFrame(frame);
      });
    }, { threshold: 0.6 });
    io.observe(el);
  });
}
function setupSkeletons(root){
  // Only IMAGE media gets the skeleton, videos render normally (poster +
  // autoplay), so the shimmer can never hide a video, even if JS is flaky.
  const host = el => el.classList.add('skel');
  const heroMedia = root.querySelector('.cs-hero-media');
  if (heroMedia && heroMedia.querySelector(':scope > img')) host(heroMedia);
  root.querySelectorAll('.cs-section-media').forEach(c => {
    if (c.querySelector(':scope > img')) host(c);
  });
  root.querySelectorAll('.cs-section-gallery .cs-tile').forEach(host);
  // Wrap loose inline-row images so each can carry its own shimmer
  root.querySelectorAll('.cs-media-row > img').forEach(img => {
    const cell = document.createElement('div');
    cell.className = 'skel cs-media-cell';
    img.replaceWith(cell);
    cell.appendChild(img);
  });
  // Tag images inside skel hosts, then wire load events (videos untouched)
  root.querySelectorAll('.skel > img').forEach(el => {
    el.classList.add('skel-img');
    wireSkel(el);
  });
}

function route() {
  const slug = (location.hash || '#linkedin-premium').slice(1);
  render(slug);
}
window.addEventListener('hashchange', route);
route();
</script>
<script>
/* ============ THEME TOGGLE, shares jp-theme with the home page ============ */
(function themeToggle(){
  const root = document.documentElement;
  const btn  = document.getElementById('themeToggle');
  if (!btn) return;
  btn.addEventListener('click', () => {
    const light = root.getAttribute('data-theme') === 'light';
    if (light) root.removeAttribute('data-theme'); else root.setAttribute('data-theme','light');
    try { localStorage.setItem('jp-theme', light ? 'dark' : 'light'); } catch(e){}
  });
})();
</script>

<script>
/* ============ COMMAND PALETTE (⌘K) ============ */
(function commandPalette(){
  const CASES = [
    ['LinkedIn Premium','linkedin-premium'], ['Wing @ Google X','wing'], ['January AI','january-ai'],
    ['Flow Wallet','flow-wallet'], ['Folio','folio'], ['Lady Gaga','little-monsters'],
  ];
  const COMMANDS = [
    ...CASES.map(([label, slug]) => ({ ico: '◆', label, sub: 'Case study', run: () => { location.hash = '#' + slug; window.scrollTo({ top: 0, behavior: 'smooth' }); } })),
    { ico: '↩', label: 'Back to home',  sub: 'Page',  run: () => go('joey-portfolio.html') },
    { ico: '▢', label: 'Selected work', sub: 'Home',  run: () => go('joey-portfolio.html#work') },
    { ico: '✦', label: 'Think. Prompt. Create.', sub: 'Book', run: () => go('joey-portfolio.html#book') },
    { ico: '✉', label: 'Contact',       sub: 'Home',  run: () => go('joey-portfolio.html#contact') },
    { ico: '📄', label: 'Résumé',        sub: 'Page',  run: () => go('resume.html') },
    { ico: '◐', label: 'Toggle Earth / Space', sub: 'Theme', run: () => document.getElementById('themeToggle')?.click() },
    { ico: '✉', label: 'Copy email',    sub: 'jprimiani@gmail.com', run: () => navigator.clipboard && navigator.clipboard.writeText('jprimiani@gmail.com') },
  ];
  function go(url){ location.href = url; }

  const overlay = document.createElement('div');
  overlay.className = 'cmdk-overlay';
  overlay.innerHTML = `
    <div class="cmdk" role="dialog" aria-modal="true" aria-label="Command palette">
      <input class="cmdk-input" type="text" placeholder="Jump to a case study, section, or action..." aria-label="Command palette search" autocomplete="off"/>
      <div class="cmdk-list" role="listbox"></div>
      <div class="cmdk-hint"><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div>
    </div>`;
  document.body.appendChild(overlay);
  const input = overlay.querySelector('.cmdk-input');
  const list = overlay.querySelector('.cmdk-list');
  let filtered = COMMANDS, sel = 0;

  function fuzzy(q, s){ q = q.toLowerCase(); s = s.toLowerCase(); if (!q) return true; let i = 0; for (const c of s){ if (c === q[i]) i++; if (i === q.length) return true; } return false; }
  function render(){
    if (!filtered.length){ list.innerHTML = '<div class="cmdk-empty">No matches.</div>'; return; }
    list.innerHTML = filtered.map((c, i) => `<div class="cmdk-item" role="option" data-i="${i}" aria-selected="${i === sel}"><span class="cmdk-ico">${c.ico}</span><span>${c.label}</span><span class="cmdk-sub">${c.sub}</span></div>`).join('');
    const cur = list.querySelector('[aria-selected="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest' });
  }
  function filterFn(){ const q = input.value.trim(); filtered = COMMANDS.filter(c => fuzzy(q, c.label) || fuzzy(q, c.sub)); sel = 0; render(); }
  let lastFocus = null;
  const trigger = () => document.getElementById('cmdkBtn');
  function open(){ lastFocus = document.activeElement; overlay.classList.add('open'); trigger()?.setAttribute('aria-expanded', 'true'); input.value = ''; filtered = COMMANDS; sel = 0; render(); setTimeout(() => input.focus(), 30); }
  function close(){ overlay.classList.remove('open'); trigger()?.setAttribute('aria-expanded', 'false'); if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch(e){} } }
  function run(i){ const c = filtered[i]; if (!c) return; close(); setTimeout(() => c.run(), 120); }

  input.addEventListener('input', filterFn);
  list.addEventListener('click', (e) => { const it = e.target.closest('.cmdk-item'); if (it) run(+it.dataset.i); });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  document.getElementById('cmdkBtn')?.addEventListener('click', open);
  addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); overlay.classList.contains('open') ? close() : open(); return; }
    if (!overlay.classList.contains('open')) return;
    if (e.key === 'Escape'){ e.preventDefault(); close(); }
    else if (e.key === 'ArrowDown'){ e.preventDefault(); sel = Math.min(sel + 1, filtered.length - 1); render(); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); sel = Math.max(sel - 1, 0); render(); }
    else if (e.key === 'Enter'){ e.preventDefault(); run(sel); }
    else if (e.key === 'Tab'){ e.preventDefault(); input.focus(); }
  });
})();
</script>
